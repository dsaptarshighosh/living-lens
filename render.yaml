services:
  - type: web
    name: living-lens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: LIVING_LENS_SECRET
        generateValue: true
      - key: LIVING_LENS_ADMIN_EMAIL
        sync: false
      - key: LIVING_LENS_ADMIN_PASSWORD
        sync: false
      - key: LIVING_LENS_KEEPER_EMAIL
        sync: false
      - key: LIVING_LENS_KEEPER_PASSWORD
        sync: false
      - key: LIVING_LENS_DEMO_ZOO
        value: Living Lens Demo Zoo
